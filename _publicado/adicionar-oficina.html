<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gycanic | Nova oficina</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-protected-page>
    <button type="button" class="gy-mobile-menu-btn" data-mobile-menu-btn aria-label="Abrir menu"><i class="fa fa-bars"></i></button>
    <!-- Formulário disponível apenas para usuários autenticados. -->
    <div class="wrapper">
      <aside class="main-sidebar">
        <section class="sidebar">
          <div class="gy-logo">
            <button
              class="gy-sidebar-toggle"
              type="button"
              aria-label="Abrir menu"
              data-sidebar-toggle
            >
              <span></span></button
            ><a href="index.html" class="gy-brand"
              ><span class="gy-accent">Gy</span>canic</a
            >
          </div>
          <ul class="sidebar-menu">
            <li>
              <a href="index.html"
                ><i class="fa fa-home"></i><span>Início</span></a
              >
            </li>
            <li class="active">
              <a href="oficinas.html"
                ><i class="fa fa-wrench"></i><span>Oficinas</span></a
              >
            </li>
            <li>
              <a href="funcionarios.html"
                ><i class="fa fa-users"></i><span>Funcionários</span></a
              >
            </li>
            <li>
              <a href="perfil.html"
                ><i class="fa fa-user"></i><span>Perfil</span></a
              >
            </li>
          </ul>
          <div class="sidebar-logout">
            <a href="login.html" data-logout class="btn btn-warning btn-block"
              ><i class="fa fa-sign-out"></i> Sair</a
            >
          </div>
        </section>
      </aside>
      <main class="content-wrapper">
        <section class="content">
          <header class="gy-page-head">
            <div>
              <p class="gy-eyebrow">Nova unidade</p>
              <h1>Adicionar oficina</h1>
              <p class="gy-lead">
                Preencha os dados essenciais para começar a organizar a
                operação.
              </p>
            </div>
          </header>
          <div class="box">
            <div class="box-body">
              <!-- Salva os dados no banco por meio do backend PHP. -->
              <form action="backend/adicionar-oficina.php" method="post">
                <div class="row">
                  <div class="col-sm-6">
                    <div class="form-group">
                      <label for="nome-oficina">Nome da oficina</label
                      ><input
                        class="form-control"
                        id="nome-oficina"
                        name="nome-oficina"
                        placeholder="Ex.: Gycanic Motors"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group">
                      <label for="email-instituicao">E-mail profissional</label
                      ><input
                        class="form-control"
                        type="email"
                        id="email-instituicao"
                        name="email-instituicao"
                        placeholder="contato@oficina.com"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group">
                      <label for="cep">CEP</label
                      ><input
                        class="form-control"
                        id="cep" data-mask-cep
                        name="cep"
                        placeholder="00000-000"
                        inputmode="numeric"
                        required
                      />
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <div class="form-group">
                      <label for="documento">CNPJ ou CPF do responsável</label
                      ><input
                        class="form-control"
                        id="documento" data-mask-documento
                        name="documento"
                        placeholder="00.000.000/0000-00"
                        required
                      />
                    </div>
                  </div>
                </div>
                <div class="gy-actions">
                  <button class="btn btn-success" type="submit">
                    <i class="fa fa-check"></i> Salvar oficina</button
                  ><a href="oficinas.html" class="btn btn-default">Cancelar</a>
                </div>
              </form>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
