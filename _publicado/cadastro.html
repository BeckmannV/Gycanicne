<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gycanic | Criar conta</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Tela pública para criar uma conta de gerente. -->
    <main class="content">
      <div class="gy-auth">
        <section class="gy-auth-form">
          <a href="index.html" class="gy-brand"
            ><span class="gy-accent">Gy</span>canic</a
          >
          <p class="gy-eyebrow" style="margin-top: 32px">Comece agora</p>
          <h1>Crie sua conta</h1>
          <p class="gy-lead">
            Leva menos de um minuto para iniciar sua gestão.
          </p>
          <!-- Dados enviados ao PHP responsável pelo cadastro. -->
          <form
            action="backend/cadastro.php"
            method="post"
            style="margin-top: 22px"
            data-validate-senha
          >
            <div class="form-group">
              <label for="nome">Seu nome</label
              ><input
                class="form-control"
                type="text"
                id="nome"
                name="nome"
                autocomplete="name"
                required
              />
            </div>
            <div class="form-group">
              <label for="email">E-mail</label
              ><input
                class="form-control"
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>
            <div class="form-group">
              <label for="senha">Senha</label
              ><input
                class="form-control"
                type="password"
                id="senha"
                name="senha"
                minlength="6"
                required
              />
            </div>
            <div class="form-group">
              <label for="confirmar-senha">Confirme a senha</label
              ><input
                class="form-control"
                type="password"
                id="confirmar-senha"
                name="confirmar-senha"
                minlength="6"
                required
              />
            </div>
            <div class="gy-form-message gy-hidden" id="cadastro-alert"></div>
            <button class="btn btn-warning" type="submit">
              Criar minha conta <i class="fa fa-arrow-right"></i>
            </button>
          </form>
          <p class="gy-form-note">
            Já possui acesso? <a href="login.html">Entrar na conta</a>
          </p>
        </section>
        <aside class="gy-auth-aside">
          <div>
            <p class="gy-eyebrow" style="color: #ffe0aa">Tudo em um só lugar</p>
            <h2>Mais tempo para cuidar dos seus clientes.</h2>
            <p>
              Organize as rotinas da oficina com uma experiência direta e
              agradável.
            </p>
          </div>
        </aside>
      </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
