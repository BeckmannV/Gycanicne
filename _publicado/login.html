<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gycanic | Entrar</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Tela pública de acesso à plataforma. -->
    <main class="content">
      <div class="gy-auth">
        <section class="gy-auth-form">
          <a href="index.html" class="gy-brand"
            ><span class="gy-accent">Gy</span>canic</a
          >
          <p class="gy-eyebrow" style="margin-top: 42px">Bem-vindo de volta</p>
          <h1>Entre na sua conta</h1>
          <p class="gy-lead">
            Acompanhe sua operação e deixe a gestão da oficina mais leve.
          </p>
          <!-- Envia as credenciais para o PHP, que cria a sessão. -->
          <form
            action="backend/login.php"
            method="post"
            style="margin-top: 28px"
          >
            <p class="alert-error gy-hidden" data-login-error></p>
            <div class="form-group">
              <label for="email">E-mail</label
              ><input
                class="form-control"
                type="email"
                id="email"
                name="email"
                placeholder="voce@exemplo.com"
                required
                autofocus
              />
            </div>
            <div class="form-group">
              <label for="senha">Senha</label
              ><input
                class="form-control"
                type="password"
                id="senha"
                name="senha"
                placeholder="Sua senha"
                required
              />
            </div>
            <button class="btn btn-warning" type="submit">
              Entrar <i class="fa fa-arrow-right"></i>
            </button>
          </form>
          <p class="gy-form-note">
            Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
          </p>
        </section>
        <aside class="gy-auth-aside">
          <div>
            <p class="gy-eyebrow" style="color: #ffe0aa">Gycanic</p>
            <h2>Uma oficina mais organizada começa aqui.</h2>
            <p>
              Ferramentas simples para manter sua equipe, seus serviços e sua
              rotina sob controle.
            </p>
          </div>
        </aside>
      </div>
    </main>
    <script src="js/main.js"></script>
  </body>
</html>
