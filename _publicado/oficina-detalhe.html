<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gycanic | Oficina</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-protected-page>
    <button type="button" class="gy-mobile-menu-btn" data-mobile-menu-btn aria-label="Abrir menu"><i class="fa fa-bars"></i></button>
    <!-- Resumo de uma oficina e atalhos para as áreas relacionadas. -->
    <div class="wrapper">
      <aside class="main-sidebar">
        <section class="sidebar">
          <div class="gy-logo">
            <button
              class="gy-sidebar-toggle"
              type="button"
              aria-label="Abrir menu"
              data-sidebar-toggle
            >
              <span></span></button
            ><a href="index.html" class="gy-brand"
              ><span class="gy-accent">Gy</span>canic</a
            >
          </div>
          <ul class="sidebar-menu">
            <li>
              <a href="index.html"
                ><i class="fa fa-home"></i><span>Início</span></a
              >
            </li>
            <li class="active">
              <a href="oficinas.html"
                ><i class="fa fa-wrench"></i><span>Oficinas</span></a
              >
            </li>
            <li>
              <a href="funcionarios.html"
                ><i class="fa fa-users"></i><span>Funcionários</span></a
              >
            </li>
            <li>
              <a href="perfil.html"
                ><i class="fa fa-user"></i><span>Perfil</span></a
              >
            </li>
          </ul>
          <div class="sidebar-logout">
            <a href="login.html" data-logout class="btn btn-warning btn-block"
              ><i class="fa fa-sign-out"></i> Sair</a
            >
          </div>
        </section>
      </aside>
      <main class="content-wrapper">
        <section class="content">
          <header class="gy-page-head">
            <div>
              <p class="gy-eyebrow">Visão geral</p>
              <h1>Minha oficina</h1>
            </div>
            <a href="oficinas.html" class="btn btn-default"
              ><i class="fa fa-arrow-left"></i> Voltar</a
            >
          </header>
          <div class="box gy-detail-top">
            <div class="gy-detail-cover">
              <div>
                <p class="gy-eyebrow">Unidade principal</p>
                <h1 data-oficina-nome>Pronta para configurar</h1>
                <p data-oficina-info>
                  <i class="fa fa-map-marker"></i> Inclua os dados da sua
                  oficina para visualizar as informações aqui.
                </p>
              </div>
            </div>
          </div>
          <div class="gy-detail-actions">
            <a href="servicos-lista.html" class="small-box gy-action-box"
              ><div class="bg-img"></div>
              <div class="inner">
                <h3>Serviços</h3>
                <div class="icon"><i class="fa fa-list-alt"></i></div>
              </div>
              <span class="small-box-footer"
                >Gerenciar serviços <i class="fa fa-arrow-right"></i></span></a
            ><a href="perfil.html" class="small-box gy-action-box"
              ><div class="bg-img"></div>
              <div class="inner">
                <h3>Equipe</h3>
                <div class="icon"><i class="fa fa-users"></i></div>
              </div>
              <span class="small-box-footer"
                >Ver perfil <i class="fa fa-arrow-right"></i></span></a
            ><a href="oficinas.html" class="small-box gy-action-box"
              ><div class="bg-img"></div>
              <div class="inner">
                <h3>Configurações</h3>
                <div class="icon"><i class="fa fa-cog"></i></div>
              </div>
              <span class="small-box-footer"
                >Ajustar unidade <i class="fa fa-arrow-right"></i></span
            ></a>
          </div>
        </section>
      </main>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
