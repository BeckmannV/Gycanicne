<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gycanic | Oficinas</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-protected-page>
    <button type="button" class="gy-mobile-menu-btn" data-mobile-menu-btn aria-label="Abrir menu"><i class="fa fa-bars"></i></button>
    <!-- Página protegida: a sessão é validada pelo main.js. -->
    <div class="wrapper">
      <aside class="main-sidebar">
        <section class="sidebar">
          <div class="gy-logo">
            <button
              class="gy-sidebar-toggle"
              type="button"
              aria-label="Abrir menu"
              data-sidebar-toggle
            >
              <span></span></button
            ><a href="index.html" class="gy-brand"
              ><span class="gy-accent">Gy</span>canic</a
            >
          </div>
          <ul class="sidebar-menu">
            <li>
              <a href="index.html"
                ><i class="fa fa-home"></i><span>Início</span></a
              >
            </li>
            <li class="active">
              <a href="oficinas.html"
                ><i class="fa fa-wrench"></i><span>Oficinas</span></a
              >
            </li>
            <li>
              <a href="funcionarios.html"
                ><i class="fa fa-users"></i><span>Funcionários</span></a
              >
            </li>
            <li>
              <a href="perfil.html"
                ><i class="fa fa-user"></i><span>Perfil</span></a
              >
            </li>
          </ul>
          <div class="sidebar-logout">
            <a href="login.html" data-logout class="btn btn-warning btn-block"
              ><i class="fa fa-sign-out"></i> Sair</a
            >
          </div>
        </section>
      </aside>
      <main class="content-wrapper">
        <section class="content">
          <header class="gy-page-head">
            <div>
              <p class="gy-eyebrow">Sua operação</p>
              <h1>Oficinas</h1>
              <p class="gy-lead">
                Encontre, acompanhe e administre suas unidades em um único
                lugar.
              </p>
            </div>
            <a href="adicionar-oficina.html" class="btn btn-success"
              ><i class="fa fa-plus"></i> Nova oficina</a
            >
          </header>
          <div class="nav-tabs-custom">
            <ul class="nav nav-tabs">
              <li class="active">
                <a href="#minhas" data-toggle="tab">Minhas oficinas</a>
              </li>
              <li><a href="#disponiveis" data-toggle="tab">Disponíveis</a></li>
            </ul>
            <div class="tab-content">
              <!-- Esta grade é preenchida pelo JavaScript com dados do PHP. -->
              <div class="tab-pane active" id="minhas">
                <div class="gy-card-grid" data-office-grid></div>
              </div>
              <div class="tab-pane" id="disponiveis">
                <div class="gy-empty">
                  <i
                    class="fa fa-search"
                    style="font-size: 28px; color: var(--orange)"
                  ></i>
                  <p>As oficinas públicas aparecerão aqui em breve.</p>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
