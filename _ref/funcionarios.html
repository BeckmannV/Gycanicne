<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gycanic | Funcionários</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-protected-page>
    <button type="button" class="gy-mobile-menu-btn" data-mobile-menu-btn aria-label="Abrir menu"><i class="fa fa-bars"></i></button>
    <div class="wrapper">
      <aside class="main-sidebar">
        <section class="sidebar">
          <div class="gy-logo">
            <button
              class="gy-sidebar-toggle"
              type="button"
              aria-label="Abrir menu"
              data-sidebar-toggle
            >
              <span></span></button
            ><a href="index.html" class="gy-brand"
              ><span class="gy-accent">Gy</span>canic</a
            >
          </div>
          <ul class="sidebar-menu">
            <li>
              <a href="index.html"
                ><i class="fa fa-home"></i><span>Início</span></a
              >
            </li>
            <li>
              <a href="oficinas.html"
                ><i class="fa fa-wrench"></i><span>Oficinas</span></a
              >
            </li>
            <li class="active">
              <a href="funcionarios.html"
                ><i class="fa fa-users"></i><span>Funcionários</span></a
              >
            </li>
            <li>
              <a href="perfil.html"
                ><i class="fa fa-user"></i><span>Perfil</span></a
              >
            </li>
          </ul>
          <div class="sidebar-logout">
            <a href="login.html" data-logout class="btn btn-warning btn-block"
              ><i class="fa fa-sign-out"></i> Sair</a
            >
          </div>
        </section>
      </aside>
      <main class="content-wrapper">
        <section class="content">
          <header class="gy-page-head">
            <div>
              <p class="gy-eyebrow">Sua equipe</p>
              <h1>Funcionários</h1>
              <p class="gy-lead">
                Cadastre novos funcionários e acompanhe quem faz parte da
                equipe.
              </p>
            </div>
          </header>

          <div class="box" data-admin-only>
            <div class="box-body">
              <h2 class="gy-card-title">Cadastrar funcionário</h2>
              <!-- Salva os dados do novo funcionário no PHP. -->
              <form
                action="backend/adicionar-funcionario.php"
                method="post"
                style="margin-top: 16px"
              >
                <section class="gy-form-section">
                  <h3 class="gy-section-title">
                    <i class="fa fa-user"></i> Identificação
                  </h3>
                  <div class="row">
                    <div class="col-sm-6">
                      <div class="form-group">
                        <label for="nome">Nome completo</label
                        ><input
                          class="form-control"
                          type="text"
                          id="nome"
                          name="nome"
                          placeholder="Nome do funcionário"
                          required
                        />
                      </div>
                    </div>
                    <div class="col-sm-6">
                      <div class="form-group">
                        <label for="email">E-mail</label
                        ><input
                          class="form-control"
                          type="email"
                          id="email"
                          name="email"
                          placeholder="nome@empresa.com"
                          required
                        />
                      </div>
                    </div>
                    <div class="col-sm-4">
                      <div class="form-group">
                        <label for="tipo-doc">Tipo de documento</label
                        ><select
                          class="form-control"
                          id="tipo-doc"
                          name="tipo_documento"
                          onchange="document.getElementById('documento').placeholder = this.value === 'cnpj' ? '00.000.000/0000-00' : '000.000.000-00'"
                        >
                          <option value="cpf">CPF</option>
                          <option value="cnpj">CNPJ</option>
                        </select>
                      </div>
                    </div>
                    <div class="col-sm-4">
                      <div class="form-group">
                        <label for="documento">CPF / CNPJ</label
                        ><input
                          class="form-control"
                          type="text"
                          id="documento"
                          name="documento"
                          placeholder="000.000.000-00"
                          data-mask-documento
                        />
                      </div>
                    </div>
                    <div class="col-sm-4">
                      <div class="form-group">
                        <label for="data_nascimento">Data de nascimento</label
                        ><input
                          class="form-control"
                          type="date"
                          id="data_nascimento"
                          name="data_nascimento"
                        />
                      </div>
                    </div>
                  </div>
                </section>

                <section class="gy-form-section">
                  <h3 class="gy-section-title">
                    <i class="fa fa-briefcase"></i> Profissional
                  </h3>
                  <div class="row">
                    <div class="col-sm-6">
                      <div class="form-group">
                        <label for="funcao">Cargo / função</label
                        ><input
                          class="form-control"
                          type="text"
                          id="funcao"
                          name="funcao"
                          placeholder="Ex.: Mecânico, Atendente, Gerente"
                        />
                      </div>
                    </div>
                    <div class="col-sm-6">
                      <div class="form-group">
                        <label for="telefone">Telefone / WhatsApp</label
                        ><input
                          class="form-control"
                          type="tel"
                          id="telefone"
                          name="telefone"
                          placeholder="(11) 99999-9999"
                          data-mask-phone
                        />
                      </div>
                    </div>
                  </div>
                </section>

                <section class="gy-form-section">
                  <h3 class="gy-section-title">
                    <i class="fa fa-map-marker"></i> Endereço
                  </h3>
                  <div class="row">
                    <div class="col-sm-8">
                      <div class="form-group">
                        <label for="endereco">Endereço</label
                        ><input
                          class="form-control"
                          type="text"
                          id="endereco"
                          name="endereco"
                          placeholder="Rua, número, bairro"
                        />
                      </div>
                    </div>
                    <div class="col-sm-4">
                      <div class="form-group">
                        <label for="cep-func">CEP</label
                        ><input
                          class="form-control"
                          type="text"
                          id="cep-func"
                          name="cep"
                          placeholder="00000-000"
                          data-mask-cep
                        />
                      </div>
                    </div>
                    <div class="col-sm-6">
                      <div class="form-group">
                        <label for="cidade">Cidade</label
                        ><input
                          class="form-control"
                          type="text"
                          id="cidade"
                          name="cidade"
                        />
                      </div>
                    </div>
                    <div class="col-sm-6">
                      <div class="form-group">
                        <label for="uf">UF</label
                        ><input
class="form-control gy-sm"
                        type="text"
                        id="uf"
                        name="uf"
                        maxlength="2"
                        placeholder="SP"
                      />
                      </div>
                    </div>
                  </div>
                </section>

                <section class="gy-form-section">
                  <h3 class="gy-section-title">
                    <i class="fa fa-lock"></i> Acesso
                  </h3>
                  <div class="row">
                    <div class="col-sm-6">
                      <div class="form-group">
                        <label for="senha">Senha inicial</label
                        ><input
                          class="form-control"
                          type="password"
                          id="senha"
                          name="senha"
                          minlength="6"
                          placeholder="Mínimo 6 caracteres"
                          required
                        />
                      </div>
                    </div>
                    <div class="col-sm-6">
                      <div class="form-group">
                        <label for="cargo">Nível de acesso</label
                        ><select
                          class="form-control"
                          id="cargo"
                          name="cargo"
                          required
                        >
                          <option value="funcionario">Funcionário</option>
                          <option value="gerente">Gerente</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </section>

                <div class="gy-actions">
                  <button class="btn btn-success" type="submit">
                    <i class="fa fa-user-plus"></i> Cadastrar funcionário</button
                  >
                </div>
              </form>
            </div>
          </div>

          <div class="nav-tabs-custom">
            <div class="gy-tabs">
              <button
                type="button"
                class="gy-tab is-active"
                data-tab-btn="todos"
              >
                <i class="fa fa-users"></i> Todos os usuários
              </button>
              <button
                type="button"
                class="gy-tab"
                data-tab-btn="gerente"
              >
                <i class="fa fa-user-circle"></i> Gerentes
              </button>
              <button
                type="button"
                class="gy-tab"
                data-tab-btn="funcionario"
              >
                <i class="fa fa-user"></i> Funcionários
              </button>
            </div>
            <div class="tab-content">
              <div class="gy-table-tools">
                <div class="form-group" style="margin:0;max-width:340px">
                  <label class="sr-only" for="busca-funcionario">Buscar funcionário</label>
                  <input
                    class="form-control"
                    type="search"
                    id="busca-funcionario"
                    placeholder="Buscar por nome, e-mail ou função"
                    data-search-func
                  />
                </div>
              </div>
              <table class="gy-table">
                <thead>
                  <tr>
                    <th></th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Função</th>
                    <th>Telefone</th>
                    <th>Cargo</th>
                    <th>Cadastro</th>
                    <th>Ações</th>
                  </tr>
                </thead>
                <tbody data-employee-grid></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
